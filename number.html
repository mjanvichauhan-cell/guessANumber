<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center px-4">
    <!-- Main Container -->
    <div class="w-full max-w-lg bg-gray-800 text-white rounded-2xl shadow-2xl p-8">
        <!-- Heading -->
        <h1 class="text-3xl md:text-4xl font-bold text-center mb-4">
            Number Guessing Game
        </h1>
        <!-- Description -->
        <div class="text-center text-gray-300 mb-8">
            <p class="mb-2">
                Guess a random number between
                <span class="font-bold text-blue-400">1 and 100</span>.
            </p>
            <p class="text-sm">
                You have only 10 attempts to guess the number!
            </p>
        </div>
        <!-- Game Form -->
        <form class="space-y-5">
            <!-- Input Label -->
            <label
                for="guessField"
                class="block text-lg font-semibold text-center"
            >
                Enter Your Guess
            </label>
            <!-- Input -->
            <input
                type="number"
                id="guessField"
                min="1"
                max="100"
                placeholder="Enter number between 1-100"
                class="w-full px-4 py-3 rounded-lg bg-gray-700
                       border border-gray-600
                       text-white text-center text-lg
                       placeholder-gray-400
                       focus:outline-none
                       focus:ring-2
                       focus:ring-blue-500"
            >
            <!-- Submit Button -->
            <button
                type="submit"
                id="subt"
                class="w-full py-3 rounded-lg
                       bg-blue-600
                       hover:bg-blue-700
                       active:scale-95
                       transition duration-200
                       font-bold text-lg"
            >
                Guess
            </button>
        </form>
        <!-- Result Section -->
        <div class="mt-8 space-y-4">
            <!-- Previous Guesses -->
            <div class="bg-gray-700 rounded-lg p-4">
                <p class="text-gray-300">
                    Previous Guesses:
                </p>
                <p class="guesses text-blue-400 font-bold text-lg mt-1">
                </p>
            </div>
            <!-- Remaining Attempts -->
            <div class="bg-gray-700 rounded-lg p-4">
                <p class="text-gray-300">
                    Remaining Guesses:
                </p>
                <p class="lastResult text-yellow-400 font-bold text-2xl mt-1">
                    10
                </p>
            </div>
            <!-- Low / High Message -->
            <div
                class="lowOrHi text-center min-h-12.5 flex items-center justify-center"
            >
            </div>
            <!-- Result Paragraph -->
            <div class="resultParas text-center">
            </div>
        </div>
    </div>
    <script src="../guessANumber/number.js"></script>
</body>
</html>
